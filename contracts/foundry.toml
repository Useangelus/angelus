[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"  # widest support on Arbitrum Orbit chains; the contract needs nothing newer
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
cbor_metadata = false

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
